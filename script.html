<script>
const id = new URLSearchParams(window.location.search).get("id");

fetch("pesan.json")
  .then(res => res.json())
  .then(data => {
      const letter = data[id];

      document.getElementById("to").textContent =
          letter.to;

      document.getElementById("from").textContent =
          letter.from;

      document.getElementById("message").innerText =
          letter.message;
  });
</script>
